contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - nginx-mainline
    - nginx-mainline-package-config

entrypoint:
  command: /usr/sbin/nginx

cmd: "-c /etc/nginx/nginx.conf -e /dev/stderr -g 'daemon off;'"

stop-signal: SIGQUIT

paths:
  - path: "/var/lib/nginx"
    type: directory
    uid: 65532
    gid: 65532
    permissions: 493 # 0755
    recursive: true
  - path: "/var/lib/nginx/tmp"
    type: directory
    uid: 65532
    gid: 65532
    # Wide permissions required for running with tmpfs. Seems to be related to Docker bug https://github.com/moby/moby/issues/40881
    permissions: 511 # 0777

    recursive: true
  - path: "/var/run"
    type: directory
    uid: 65532
    gid: 65532
    # Wide permissions required for running with tmpfs. Seems to be related to Docker bug https://github.com/moby/moby/issues/40881
    permissions: 511 # 0777
    recursive: false

accounts:
  run-as: nginx
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      gid: 65532
      uid: 65532

archs:
  - arm64
  - amd64
